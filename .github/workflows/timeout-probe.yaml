name: timeout-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: wedge
        run: sleep 300
      - name: on-failure
        if: failure()
        run: echo "failure-ran"
      - name: on-always
        if: always()
        run: echo "always-ran"
