name: tend-sandbox-probe
on:
  workflow_dispatch:
    inputs:
      ref:
        description: max-sixty/tend ref to probe
        required: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: max-sixty/tend
          ref: ${{ inputs.ref }}
      # Stand in for an adopter `setup:` step. Installing under $HOME and
      # announcing the dir through GITHUB_PATH is what the cargo-install
      # actions do; the addition lands in the next step's PATH, exactly as
      # setup-sandbox.sh sees it in a real run.
      - name: Install a tool the way an adopter's setup does
        run: |
          bin="$HOME/.cargo-install/tend-probe/bin"
          mkdir -p "$bin"
          printf '#!/bin/sh\necho probe\n' >"$bin/tend-probe"
          chmod +x "$bin/tend-probe"
          echo "$bin" >>"$GITHUB_PATH"
      - name: Set up the sandbox
        env:
          TEND_GH_TOKEN: dummy
          TEND_ANTHROPIC_OAUTH_TOKEN: dummy
          ACTION_PATH: ${{ github.workspace }}
          TEND_UV_DIR: ${{ runner.temp }}/tend-uv
          UV_CACHE_DIR: ${{ runner.temp }}/tend-mitmproxy-uv
          # The adopter lever, exercised on its supported input: a `~` entry
          # expands to the sandbox home and wins the front of the PATH. Its
          # unsupported input — a runner-home dir, which would put the
          # credential-holding home on the agent's PATH — is refused by
          # setup-sandbox.sh before the env file is written.
          TEND_SANDBOX_PATH: "~/.cargo/bin"
        run: |
          set -o pipefail
          MITMPROXY_VERSION=$(yq -e '.inputs.mitmproxy_version.default' claude/action.yaml)
          export MITMPROXY_VERSION
          UV_VERSION=$(yq -e '.inputs.uv_version.default' claude/action.yaml) \
            bash shared/steps/install-proxy-uv.sh
          bash proxy/setup-sandbox.sh | tee "$RUNNER_TEMP/setup.log"
          agent_path=$(sed -n 's/^\[setup-sandbox\] sandbox PATH: //p' "$RUNNER_TEMP/setup.log")
          if [ -z "$agent_path" ]; then
            echo "::error::setup-sandbox.sh logged no sandbox PATH"
            exit 1
          fi
          case ":$agent_path:" in
            *":$HOME/"* | *":$HOME:"*)
              echo "::error::a runner-home entry reached the sandbox PATH: $agent_path"
              exit 1
              ;;
          esac
          case "$agent_path" in
            /home/tend-sandbox/.cargo/bin:*) ;;
            *)
              echo "::error::sandbox_path's ~ entry did not expand to the front: $agent_path"
              exit 1
              ;;
          esac
      # No sandbox_setup, so this is the report alone — the state an adopter is
      # in before they know they need the lever.
      - name: Name what the agent cannot reach
        run: |
          set -o pipefail
          bash shared/steps/sandbox-setup.sh | tee "$RUNNER_TEMP/report.log"
          report=$(grep "not the agent's:" "$RUNNER_TEMP/report.log" || true)
          case "$report" in
            *tend-probe*) ;;
            *) echo "::error::the report did not name the planted tool: $report"; exit 1 ;;
          esac
          # git is on both PATHs, so naming it would mean the diff had degraded
          # into reporting the runner's whole PATH.
          case "$report" in
            *" git "*) echo "::error::the report named a reachable command: $report"; exit 1 ;;
          esac
      # And the lever closes it. ~runner resolves through passwd, so the copy
      # doesn't depend on where the runner's home sits.
      - name: sandbox_setup closes the gap
        env:
          # The shape docs/tend.example.yaml documents: copy the binary in,
          # then RUN it — `command -v` would pass for a copied script whose
          # interpreter or libraries still live in the runner's home.
          TEND_SANDBOX_SETUP: |
            mkdir -p ~/.local/bin
            cp ~runner/.cargo-install/tend-probe/bin/tend-probe ~/.local/bin/
            tend-probe
        run: |
          set -o pipefail
          bash shared/steps/sandbox-setup.sh | tee "$RUNNER_TEMP/report-after.log"
          # Scoped to the report line: the echoed sandbox_setup commands name
          # the tool too, and matching those would fail this spuriously.
          if grep "not the agent's:" "$RUNNER_TEMP/report-after.log" | grep -q tend-probe; then
            echo "::error::still unreachable after sandbox_setup copied it in"
            exit 1
          fi
      - name: Restore workspace ownership for checkout cleanup
        if: always()
        run: |
          if [ -n "${SANDBOX:-}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi
