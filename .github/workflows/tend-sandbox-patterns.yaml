name: tend-sandbox-patterns
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: max-sixty/tend
          ref: tend-sandbox-path-diagnostics

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g cowsay

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --user nox
      - run: uv tool install hatch

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.0"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-sort

      - name: Record runner resolutions
        run: |
          echo "PROBE runner PATH=$PATH"
          env | sort | grep -E '^(CARGO_HOME|RUSTUP_HOME|JAVA_HOME|GOROOT|pythonLocation|UV_)=' || true
          for command in uv node cowsay python nox hatch go java rustup rustc cargo cargo-hack cargo-sort; do
            printf 'PROBE runner %-12s %s\n' "$command" "$(command -v "$command" || echo MISSING)"
          done
          printf 'PROBE runner rustc-version '
          rustc --version
          find "$HOME" -maxdepth 5 \( -name nox -o -name hatch -o -name cargo-hack -o -name cargo-sort -o -name rustc \) -print 2>/dev/null | sort

      - name: Set up Tend sandbox
        env:
          TEND_GH_TOKEN: dummy
          TEND_ANTHROPIC_OAUTH_TOKEN: dummy
          ACTION_PATH: ${{ github.workspace }}
          TEND_UV_DIR: ${{ runner.temp }}/tend-uv
          UV_CACHE_DIR: ${{ runner.temp }}/tend-mitmproxy-uv
        run: |
          MITMPROXY_VERSION=$(yq -e '.inputs.mitmproxy_version.default' claude/action.yaml)
          export MITMPROXY_VERSION
          UV_VERSION=$(yq -e '.inputs.uv_version.default' claude/action.yaml) \
            bash shared/steps/install-proxy-uv.sh
          bash proxy/setup-sandbox.sh

      - name: Record sandbox resolutions
        run: |
          mapfile -t agent_env <"$AGENT_ENV_FILE"
          sudo -u "$SANDBOX" env "${agent_env[@]}" bash -c '
            echo "PROBE sandbox PATH=$PATH"
            env | sort | grep -E "^(CARGO_HOME|RUSTUP_HOME|JAVA_HOME|GOROOT|pythonLocation|UV_)=" || true
            for command in uv node cowsay python nox hatch go java rustup rustc cargo cargo-hack cargo-sort; do
              printf "PROBE sandbox %-12s %s\\n" "$command" "$(command -v "$command" || echo MISSING)"
            done
            printf "PROBE sandbox rustc-version "
            rustc --version
          '

      - name: Restore workspace ownership
        if: always()
        run: |
          if [ -n "${SANDBOX:-}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi
