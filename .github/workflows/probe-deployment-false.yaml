name: probe-deployment-false

# Throwaway probe: does `deployment: false` skip the deployment record while
# still enforcing the environment's protection rules? Delete when answered.

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Environment to name
        required: true
        default: probe-branchpolicy

permissions: {}

jobs:
  with_flag:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.env_name }}
      deployment: false
    steps:
      - name: Report
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "job=with_flag ref=$GITHUB_REF secret_len=${#PROBE_SECRET}"

  without_flag:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.env_name }}
    steps:
      - name: Report
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "job=without_flag ref=$GITHUB_REF secret_len=${#PROBE_SECRET}"
