name: probe-softprops-publish

# Probe workflow for the immutable-releases feasibility sweep. Two independent
# paths: (a) create draft / concurrent uploads / publish, with the publish done
# by softprops/action-gh-release@v3 rather than the gh CLI; (b) a single-shot
# action call with no `draft:` input and no pre-existing release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Base tag for this probe
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "${{ inputs.tag }}" \
            --notes "seed body"

  upload:
    needs: create-draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [alpha, bravo, charlie]
    steps:
      - name: Build a fake artifact
        run: dd if=/dev/urandom of="asset-${{ matrix.target }}.bin" bs=1024 count=32
      - name: Upload to the draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          append_body: true
          files: asset-${{ matrix.target }}.bin

  publish:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft with the action
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: false
          append_body: true
      - name: Report final state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ inputs.tag }}" \
            --jq '"FINAL " + (. | {tag_name, draft, immutable, body, assets: [.assets[].name]} | tostring)'

  single-shot:
    # No pre-existing release, no `draft:` input: does the action create a
    # draft, upload, and publish in one call under immutable releases?
    runs-on: ubuntu-latest
    steps:
      - name: Build a fake artifact
        run: dd if=/dev/urandom of="single.bin" bs=1024 count=32
      - name: Create, upload and publish in one call
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}-single
          target_commitish: ${{ github.sha }}
          body: single-shot body
          files: single.bin
      - name: Report final state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ inputs.tag }}-single" \
            --jq '"FINAL " + (. | {tag_name, draft, immutable, body, assets: [.assets[].name]} | tostring)'
