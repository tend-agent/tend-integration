name: probe-release-event

# Probe workflow for the immutable-releases feasibility sweep. Logs which
# `release` activity types actually fire, whether publishing a draft also fires
# tag-level events, and mirrors PRQL's upload-on-release step to see how it
# fails under immutable releases.

on:
  release:
    types:
      - created
      - published
      - prereleased
      - released
      - edited
      - unpublished
      - deleted
  create:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  log-event:
    runs-on: ubuntu-latest
    steps:
      - name: Log event
        run: |
          echo "PROBE event_name=${{ github.event_name }}"
          echo "PROBE action=${{ github.event.action }}"
          echo "PROBE ref=${{ github.ref }}"
          echo "PROBE ref_type=${{ github.event.ref_type }}"
          echo "PROBE draft=${{ github.event.release.draft }}"
          echo "PROBE prerelease=${{ github.event.release.prerelease }}"
          echo "PROBE tag_name=${{ github.event.release.tag_name }}"

  prql-shaped-upload:
    # Byte-for-byte the shape of PRQL's `build-prqlc` upload step.
    runs-on: ubuntu-latest
    if: github.event.action == 'released'
    steps:
      - name: Build a fake artifact
        run: echo "upload attempted from a release-triggered job" > probe-on-released.bin
      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          files: probe-on-released.bin
