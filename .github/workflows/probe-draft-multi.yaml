name: probe-draft-multi

# Probe workflow for the immutable-releases feasibility sweep. Creates a draft
# release, uploads to it from several concurrent matrix jobs, then publishes it
# from a `needs:` job.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create as a draft release
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "${{ inputs.tag }}" \
            --notes "seed body"

  upload:
    needs: create-draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [alpha, bravo, charlie, delta, echo, foxtrot]
    steps:
      - name: Build a fake artifact
        run: dd if=/dev/urandom of="asset-${{ matrix.target }}.bin" bs=1024 count=64
      - name: Upload to the draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          append_body: true
          body: "- uploaded ${{ matrix.target }}"
          files: asset-${{ matrix.target }}.bin

  publish:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Report final state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ inputs.tag }}" \
            --jq '{tag_name, draft, immutable, body, assets: [.assets[].name]}'
