name: tend-mention

# Probe stub: replaces the real tend-mention in this PR branch. If this
# job's log appears, review-event runs for fork PRs execute the merge
# ref's workflow copy (the PR's own files), not the base branch's.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  probe-copy-marker:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "PR-COPY-MENTION — merge-ref workflow copy ran"
